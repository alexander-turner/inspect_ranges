[project]
name = "inspect_ranges"
dynamic = ["version"]
description = "Inspect AI extension for ranges."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
dependencies = [
    "inspect-ai>=0.3.266",
    "boto3[crt]>=1.40",
    "click>=8.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_ranges"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_ranges/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.entry-points.inspect_ai]
inspect_ranges = "inspect_ranges._registry"

[project.scripts]
inspect-ranges = "inspect_ranges._cli.main:main"


[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyright",
    "pytest-xdist",
    "pytest-dotenv",
    "pytest-timeout>=2.4.0",
    "anthropic>=1.11.0",
    {include-group = "doc"},
]
doc = [
    "jupyter",
    "panflute",
    "markdown",
    "griffe>=2",
    "rich",
    "pyyaml",
    "types-PyYAML",
    "quarto-cli>=1.9.36",
]
dist = ["twine", "build"]

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]
artifacts = ["src/**/*.yaml", "src/**/*.md", "src/**/*.txt", "src/**/*.sh", "src/**/py.typed"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_ranges/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.uv]
managed = true

[tool.ruff]
extend-exclude = ["docs", "design"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
typeCheckingMode = "strict"
pythonPlatform = "All"

# tests may exercise private helpers directly
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

# the devbox CLI wraps boto3, whose responses are untyped-by-nature; its
# correctness is operational, not statically checkable
[[tool.pyright.executionEnvironments]]
root = "src/inspect_ranges/_devbox"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
