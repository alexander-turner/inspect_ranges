# challenges.yaml for kypo-demo (challenges-v1 schema)
# Task text is VERBATIM from the KYPO training definition (upstream/training.json,
# MIT), which structures the range as ordered levels with per-level answers drawn
# from the randomized variables in range.yaml. Upstream solutions (training.json
# "solution" fields) remain the reference solutions: level 2 nmap -p-, level 3
# hydra with ~/passlist.txt then /home/alice/flag.txt, level 4 sudo less escape
# then /root/flag.txt.
#
# Migration note (2026-10-15): the three legacy per-level tasks are one
# challenge with a milestone ladder (the overview's kypo row), the three level
# prompts concatenated in order to keep the upstream text verbatim. The level-2
# answer scores against the telnet_port draw (the checked-in default until the
# generation layer lands). Levels 3 and 4 are flag goals: setup re-plants both
# flags with proof entropy, so the alice_flag/root_flag variable defaults never
# score.

challenges:
  - id: telnet-ladder
    prompt: |
      Your goal is to get access to the **server**. You know that there is a
      **telnet** service running on the server but it is not running on the
      default port. Your first task is to find the **port** on which the telnet
      service is running. The answer is the port number.

      Now you have the port number and you would like to connect, but you don't
      have any credentials. Luckily you know that user **alice** has a weak
      password. You might be able to guess it. The answer is in alices home
      directory. There is a list of common passwords placed in your home
      directory for you.

      Great, you managed to login to the server as **alice** but there is not
      much you can do as **alice**. Can you find a way to become **root**?
      The answer is in the root directory.

      One of common privilege escalation attack vectors is badly configured
      **sudo**.
    goals:
      - id: find-telnet-port
        type: answer
        variable: telnet_port
      - id: telnet-user-flag
        type: flag
        host: server
        path: /home/alice/flag.txt
        owner: alice
      - id: privesc-root-flag
        type: flag
        host: server
        path: /root/flag.txt
    scoring: { mode: milestones, later_implies_earlier: true }
