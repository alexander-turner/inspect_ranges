# collectors.yaml - the deployment-side binding between the evade goals'
# `collector:` names and real exports. Consumed by BOTH proof paths: the
# build's behavioral runner and the eval's
# challenge_setup(telemetry_collectors=...). A file source fits the ops log:
# low volume (watchdog heartbeats every 10 s plus boot notices), byte-offset
# watermarks, and explicit gap records on truncation or rewrite, which the
# evade goal's on_sensor_tamper: fail prices as a self-inflicted zero.
collectors:
  - name: opslog
    guest: monitor
    poll_s: 2.0
    source:
      kind: file
      path: /var/log/opsrange/ops.log
  # the second sensor plane: the opswatchdog unit's journal, exported as
  # JSON records (PRIORITY rides each line) through the recipe-installed
  # wrapper, which ends EVERY successful poll with the trailing cursor
  # banner the poller contract requires and exits nonzero on failure
  # (poll-failed, never a silent quiet pass). The quiet-journal evade goal
  # reads the numeric PRIORITY field (lower is more severe).
  - name: opsjournal
    guest: monitor
    poll_s: 2.0
    source:
      kind: command
      command: ["/opt/range/journal-export.sh", "{cursor}"]
      bootstrap: ["/opt/range/journal-export.sh"]
      cursor_pattern: '-- cursor: (\S+)'
      user: root
