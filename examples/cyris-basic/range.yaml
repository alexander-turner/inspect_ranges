# range.yaml — schema v0.3 (remaining deferred content in ./deferred.yaml)
# Faithful translation of the CyRIS (JAIST) `examples/full.yml` reference range.
# Every value is sourced from ./upstream/ unless marked "default:" (invented), "realized:" (substrate realization, 2026-10-19), or "to-verify".
# Provenance: ./source.md (upstream) and ./notes.md (per-field detail)

range:
  name: cyris-basic
  schema_version: "0.3"
  description: >
    CyRIS's reference cyber range: a desktop (entry point) in an "office"
    segment and a webserver in a "servers" segment, joined by a firewall VM
    that forwards only ports 25 and 53 office→servers. KVM/libvirt-native
    (the closest substrate precedent for inspect_ranges). Its distinctive
    layer is per-guest setup tasks: accounts, packages, content copy, program
    execution, iptables rulesets, plus emulated attacks/traffic/malware for
    forensics-style noise. Two clone instances deployed from one definition.

networks:
  - name: office
    # CyRIS assigns cloned-range subnet CIDRs automatically; not stated in the file.
    cidr: 10.1.10.0/24           # default: chosen here; upstream auto-assigns (to-verify)
    mode: isolated               # inter-segment traffic only via the firewall gateway
  - name: servers
    cidr: 10.1.20.0/24           # default: chosen here; upstream auto-assigns (to-verify)
    mode: isolated

routers:
  - name: firewall               # a full guest VM acting as gateway, not substrate routing
    image: noble-range-guest     # realized: the catalog golden (upstream basevm_firewall.xml, KVM)
    interfaces:                  # upstream pins NIC names (eth0/eth1); NIC naming is generated here
      - { network: office }      # gateway for office members
      - { network: servers }     # gateway for servers members
    acl:                         # upstream `forwarding: {src: office, dst: servers, dport: [25, 53]}`
      - { from: office, to: servers, allow: [tcp/25, tcp/53] }
    # upstream also gives the firewall a guest account (robot.abc) and marks it
    # is_host: true; router guest CONTENT is unrealized (no router provisioning
    # yet) and lives in deferred.yaml until that lands

hosts:
  - name: desktop
    os: { type: linux, distro: ubuntu-20.04 }  # realized on ubuntu (upstream RPM-based; tool semantics preserved, yum->apt)
    image: ubuntu-focal          # realized: the catalog golden (upstream basevm_desktop.xml, KVM)
    interfaces:
      - { network: office, ip: 10.1.10.5 }   # default: pinned here (upstream IPAM auto-assigns)
    provisioning:
      # upstream per-guest tasks (deferred.yaml carries the originals): accounts,
      # tools, the emulated ssh-attack noise, both planted captures, the dummy
      # resident malware; the flag file stays the plant layer's, never baked
      - { recipe: cyris.desktop }
    users:
      - { name: daniel, password: danielpass, note: full name Daniel Radcliffe }
      - { name: root, password: abcd1234 }  # modify_account
    data:
      - { path: /root/flag.txt, description: flag, sensitive: true }
      - { path: /home/trainee/traffic1.pcap, description: "pre-planted ssh-attack capture (source 69.89.31.226; upstream medium noise; realized: pure attack frames)" }
      - { path: /home/trainee/traffic2.pcap, description: "pre-planted dos-attack capture (upstream medium noise; realized: pure attack frames)" }

  - name: webserver
    os: { type: linux, distro: ubuntu-20.04 }  # realized on ubuntu (upstream RPM-based)
    image: ubuntu-focal          # realized: the catalog golden (upstream basevm_webserver.xml, KVM)
    interfaces:
      - { network: servers, ip: 10.1.20.5 }  # default: pinned here (upstream IPAM auto-assigns)
    provisioning:
      - { recipe: cyris.webserver }
    users:
      - { name: daniel, password: JamesBond }
      - { name: root, password: new-root-password }
    services:
      - { name: httpd, port: 80 }   # + php; port not stated upstream (default: 80)
    data:
      - { path: /root/flag.txt, description: flag, sensitive: true }
      - { path: /home/traffic.pcap, description: "pre-planted ddos-attack capture (upstream medium noise; realized: pure attack frames)" }
      - { path: /home/wireless.pcap, description: pre-planted wireless capture (aircrack-ng exercise) }

attacker:
  host: desktop                  # entry_point: yes in clone_settings
  entry: assumed-breach          # trainee/agent lands on the entry-point guest
  egress: none                   # to-verify: not specified upstream (default: none)

