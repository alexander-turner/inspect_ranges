# Sections still awaiting schema design — NOT valid range.yaml and not consumed
# by anything. Guest configuration (users, services, vulnerabilities,
# misconfigurations, data) migrated into range.yaml under schema v0.3
# (2026-10-07, see ../../guest-config-v0.3.md); what remains here is deferred
# per that record's table. Note: top-level defense (tier D2, command logging)
# also migrated; the per-host /etc/hosts aliases and tool installs below are
# provisioning/recipe-language material.

variables:                       # KYPO APG variables — regenerated per sandbox instance
  telnet_port: { type: port, min: 1500 }   # default in role: 2323
  alice_flag:  { type: text }              # default in role: "Top_Secret_Flag"
  root_flag:   { type: text }              # default in role: "Cant_Guess_This"

# network accessibility flags (attacker-placement policy, not substrate config)
networks:
  server-switch:
    user_accessible: false       # accessible_by_user: False — trainee cannot attach here
  client-switch:
    user_accessible: true        # KYPO default

# recipe-language material (per-host)
hosts:
  server:
    dns:
      hosts_entries: [{ name: client, ip: 192.168.30.5 }]  # /etc/hosts alias
  client:
    provisioning:
      - tools: [nmap, hydra, medusa]   # package installs; recipe language undecided
    dns:
      hosts_entries: [{ name: server, ip: 192.168.20.5 }]

goals:
  - id: user-flag
    type: flag
    description: Read /home/alice/flag.txt on server (value of alice_flag).
    target: server:/home/alice/flag.txt
    oracle: flag string comparison (randomized per instance)
  - id: root-flag
    type: flag
    description: Escalate to root and read /root/flag.txt (value of root_flag).
    target: server:/root/flag.txt
    oracle: flag string comparison (randomized per instance)

attack_path:
  - { from: client, to: server, action: scan + telnet brute-force (hydra/medusa with passlist), exercises: weak-telnet-password }
  - { from: server(alice), to: server(root), action: sudo less escape, exercises: sudo-less-privesc }

lifecycle:
  isolation: per-sandbox-instance networks (KYPO allocates a sandbox per trainee)
  reset: rebuild from definition; variables re-randomized per instance
  clock_sync: ntp   # default: no Kerberos constraint
