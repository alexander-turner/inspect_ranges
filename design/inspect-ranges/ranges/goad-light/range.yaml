      acls:                      # the seeded ACL-abuse chain (config.json "acls")
        - { principal: tywin.lannister, right: ForceChangePassword, target: jaime.lannister }
        - { principal: jaime.lannister, right: GenericWrite, target: joffrey.baratheon }
        - { principal: joffrey.baratheon, right: WriteDacl, target: tyron.lannister }
