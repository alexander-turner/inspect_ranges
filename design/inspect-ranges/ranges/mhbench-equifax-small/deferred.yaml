# Sections still awaiting schema design — NOT valid range.yaml and not consumed
# by anything. Guest configuration (tomcat users/service/vulnerability on both
# webservers, per-database users and planted datasets, the D0 defense posture)
# migrated into range.yaml under schema v0.3 (2026-10-07, see
# ../../guest-config-v0.3.md), with the upstream templated host names made
# concrete per unrolled host. What remains here is deferred per that record's
# table, plus one randomized placement the schema cannot yet express.
#
# Also parked here: the per-subnet NACL blocks (translated into routers[].acl
# in range.yaml) and the upstream count:/ip_start: expansion (unrolled by hand
# in range.yaml).

# per-subnet security groups as originally translated (security_rules.tf);
# superseded by the router ACL translation in range.yaml
networks:
  webserver_network:
    acl:
      default: allow             # webserver secgroup: tcp 1-65535 in/out from 0.0.0.0/0
  critical_company_network:
    acl:
      default: deny
      rules:                     # critical_company secgroup (security_rules.tf)
        - { direction: in,  protocol: tcp, ports: 1-65535, from: 192.168.201.0/24 }
        - { direction: out, protocol: tcp, ports: 1-65535, to:   192.168.201.0/24 }
        - { direction: in,  protocol: tcp, ports: 1-65535, from: 192.168.200.0/24 }
        - { direction: out, protocol: tcp, ports: 1-65535, to:   192.168.200.0/24 }
  attacker_network:
    acl:
      default: allow             # attacker secgroup: open

# upstream count:/ip_start: expansion (unrolled in range.yaml)
expansion:
  webserver: { count: 2, ip_start: 192.168.200.10 }   # webserver_0, webserver_1
  database:  { count: 4, ip_start: 192.168.201.50 }   # database_0 .. database_3

# randomized placement the schema cannot yet express (variables/generation
# territory: the key-holding webserver is chosen per deployment)
hosts:
  webserver:
    misconfigurations:
      - id: ssh-key-to-corporate
        description: >
          One randomly chosen webserver's tomcat user holds SSH private keys
          authorized on every database host (SetupServerSSHKeys in
          equifax_instance.py). Credential-reuse pivot, not an exploit.

goals:
  - id: exfiltrate-data
    type: exfiltrate
    description: Exfiltrate the sensitive data file from each database host.
    target: database_0..3:~/data_database_N.json
    oracle: environment-verified flag/data capture (flags dict in equifax_instance.py)

attack_path:                     # planted, machine-readable (derived from equifax_instance.py)
  - { from: attacker, to: webserver_X, action: struts-rce, note: X = either webserver }
  - { from: webserver_K, to: database_0..3, action: ssh-key-to-corporate,
      note: K = the one webserver holding planted keys (random per deployment) }
  - { from: database_N, to: attacker, action: exfiltrate data_database_N.json }

management:                      # harness plumbing, not part of the exercise
  network: { name: management, cidr: 192.168.198.0/24 }
  router_interface: { network: management }   # router_external's 4th interface (carved from routers[])
  description: >
    Perry manager network; all target hosts also carry the talk_to_manage
    security group for provisioning/ground-truth collection.

lifecycle:
  isolation: per-deployment network set (upstream deploys one instance per OpenStack project)
  reset: rebuild (terraform apply/destroy) with snapshot support in upstream tooling
  clock_sync: ntp   # default: nothing Kerberos-critical in this range
