attacker:
  name: attacker
  # realized: no image line; the schema default IS the catalog's standard
  # attack image now (upstream image_name Kali; the toolset need is the same)
  resources: { cpus: 1, memory_mb: 2048 }       # default: translated from flavor m1.small
  interfaces:
    - { network: attacker_network, ip: 192.168.202.100 }
  entry: external               # starts outside; no foothold on targets
  egress: none                  # realized: sealed for evals (upstream open; recorded in deferred.yaml)
