    services:
      - { name: ssh, port: 22, note: "the pivot's lateral surface (sshd unmasked by the recipe; the goldens mask it by default)" }
    users:
      - { name: database2, password: ubuntu }   # per-host user named after the host, underscores stripped (CreateUser)
