# Sections still awaiting schema design — NOT valid range.yaml and not consumed
# by anything. Guest configuration (users, services, the Ansible role as a
# provisioning reference, the D2 defense posture with its telemetry flow)
# migrated into range.yaml under schema v0.3 (2026-10-07, see
# ../../guest-config-v0.3.md); what remains here is deferred per that record's
# table.

# attack_range_password migrated to range.yaml variables (2026-10-07);
# ip_whitelist stays here with the ingress policy it scopes
variables:
  ip_whitelist: 0.0.0.0/0                 # management-plane ingress allowlist

# network-level operator ingress (management plane; references ip_whitelist above)
networks:
  lab:
    ingress:                     # management-plane access from outside the range
      - { from: "{{ ip_whitelist }}", to: [ssh, rdp, splunk-web, guacamole] }

# upstream operator-access description (attacker section)
attacker:
  access: via guacamole RDP/SSH with the shared password

goals:
  - id: detection-verified       # default: attack_range scores nothing; its purpose is
    type: detection              # technique execution + detection lookup. For an eval,
    description: >               # the natural oracle inverts the usual one:
      Execute a given ATT&CK technique on the win host and produce (or evade)
      the corresponding detection in Splunk.
    oracle: Splunk search over forwarded indexes   # default

attack_path: n/a                 # detection lab; no planted multi-host path

lifecycle:
  isolation: per-deployment VPC + ip_whitelist
  reset: rebuild via terraform (tens of minutes) or AMI snapshot
  clock_sync: ntp
  notes: v5 is cloud-only (AWS/Azure/GCP); local Vagrant support was dropped.
