# range.yaml — schema v0.3 (remaining deferred content in ./deferred.yaml)
# Faithful translation of Splunk attack_range v5, AWS "splunk_windows" template —
# the instrumented/blue-team example. Values sourced from ./upstream/ unless
# marked "default:" or "to-verify". Provenance detail: ./notes.md

range:
  name: attack-range-windows
  schema_version: "0.3"
  description: >
    Splunk's attack_range in its smallest Windows configuration: one Ubuntu
    host running Splunk Enterprise 10.2.2 (plus Apache Guacamole for browser
    RDP/SSH access) and one Windows Server 2022 endpoint whose logs (Sysmon,
    Windows Event Log, PowerShell) forward to the Splunk host. The range
    exists to execute attack techniques and verify their detection — the one
    example where telemetry collection is the point, exercising a
    defense/telemetry section no red-only range needs.

variables:
  attack_range_password: { type: password, default: "changeme123!" }   # the template's single shared credential

networks:
  - name: lab
    cidr: 10.0.2.0/24            # to-verify: hosts are 10.0.2.10/.11 via ip_last_octet;
                                 # exact VPC subnet CIDR set by attack_range terraform
    mode: nat                    # cloud VPC; instances need egress for install
    dhcp: false                  # addresses pinned via ip_last_octet

hosts:
  - name: splunk
    os: { type: linux, distro: ubuntu-22.04 }
    image: ubuntu-jammy-22.04    # default: AMI ubuntu-jammy-22.04, owner 099720109477
    resources: { cpus: 4, memory_mb: 16384 }   # default: translated from instance_type t3.xlarge
    interfaces: [{ network: lab, ip: 10.0.2.10 }]   # ip_last_octet: 10
    users:
      - { name: ubuntu, password: "{{attack_range_password}}" }
    services:
      - { name: splunk-enterprise, port: 8000, version: 10.2.2,   # default: web UI port not in template
          note: role P4T12ICK.ludus_ar_splunk }
      - { name: guacamole,
          note: "role P4T12ICK.ar_guacamole; brokers ssh->splunk:22 (ubuntu) and rdp->win:3389 (Administrator)" }

  - name: win
    os: { type: windows, version: server-2022 }
    image: Windows_Server-2022-English-Full-Base   # default: AMI from the template
    resources: { cpus: 2, memory_mb: 8192 }    # default: translated from instance_type t3.large
    interfaces: [{ network: lab, ip: 10.0.2.11 }]   # ip_last_octet: 11
    users:
      - { name: Administrator, password: "{{attack_range_password}}" }
    services:
      - { name: rdp, port: 3389 }
    provisioning:
      - recipe: P4T12ICK.ludus_ar_windows
        vars: { splunk_ip: "10.0.2.10" }   # couples to hosts[splunk].interfaces[0].ip
        # installs forwarder + telemetry stack; Sysmon/WinEventLog/PowerShell
        # logging per role docs (to-verify: exact source list)

attacker:
  entry: operator                # attack_range's model: the operator (or Atomic Red Team
                                 # automation) executes techniques ON the win host; there
                                 # is no separate attacker VM in this template
  interfaces: [{ network: lab }] # default: operator access brokered in-lab (guacamole);
                                 # see deferred.yaml for the upstream access description
  egress: none                   # default: not an attacker-egress range

defense:
  tier: D2
  description: >
    Full endpoint telemetry (Windows endpoint -> Splunk) — detections are
    recorded and searchable, not acted on. No blocking EDR in this template.
  telemetry:
    - { source: win, collector: "Sysmon/WinEventLog/PowerShell (per ludus_ar_windows role)",
        sink: splunk }
