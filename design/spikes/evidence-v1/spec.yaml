# evidence-v1 spike range: two static-IP segments joined by a router, so
# the rendered compose carries exactly the eight-capability floor (no DHCP, no
# range-served DNS: neither NET_RAW nor NET_BIND_SERVICE is granted). The ACL
# admits icmp and the flood port so cross-segment flows exist to capture.
range:
  name: evidence-v1
  schema_version: "0.2"
  description: >
    Battery range for the evidence-v1 phase: per-segment capture, streaming,
    and verification against a dmz and an internal segment joined by a router,
    with known cross-segment and same-segment flows generated over vsock exec.

networks:
  - name: dmz
    cidr: 10.94.10.0/24
    mode: isolated
  - name: internal
    cidr: 10.94.20.0/24
    mode: isolated

routers:
  - name: router
    os: { type: linux }
    image: ev1-guest
    interfaces:
      - { network: dmz, ip: 10.94.10.1 }
      - { network: internal, ip: 10.94.20.1 }
    acl:
      - { from: dmz, to: internal, allow: [icmp, udp/9999] }

hosts:
  - name: web
    os: { type: linux }
    image: ev1-guest
    interfaces: [{ network: dmz, ip: 10.94.10.10 }]
  - name: db
    os: { type: linux }
    image: ev1-guest
    interfaces: [{ network: internal, ip: 10.94.20.10 }]

attacker:
  image: ev1-guest
  interfaces: [{ network: dmz, ip: 10.94.10.3 }]
  entry: external
  egress: none
