# Hardened range container profile. Deltas from the prototype spikes:
#   - cap_drop ALL: Docker's default capability set is gone; what remains is
#     the explicit list below (the prototype's cap_add was additive)
#   - no apparmor=unconfined: docker-default AppArmor applies
#   - default seccomp applies (never disabled, now load-bearing)
#   - no-new-privileges: no privilege gain via setuid/file caps
# Capability rationale:
#   NET_ADMIN  bridges + nftables inside this netns
#   CHOWN      libvirtd (dynamic_ownership) hands overlays/seeds/devices to libvirt-qemu
#   DAC_OVERRIDE, FOWNER  libvirtd managing files it chowned away
#   SETUID, SETGID  libvirtd dropping QEMU to libvirt-qemu
#   SETPCAP    libvirtd clearing the capability bounding set of spawned QEMU
#   KILL       root libvirtd signalling non-root QEMU processes
services:
  range:
    build: ./range
    init: true
    # Docker provides NO networking to the range container (boot-storm
    # finding, promoted to the production template): no veth, no docker0,
    # no embedded DNS, no port publishing, no per-container iptables rules.
    # Non-propagation is interface-absence, not configuration.
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
      - KILL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kvm
      - /dev/vhost-vsock
      - /dev/vhost-net
      - /dev/net/tun
    volumes:
      - ${IMAGE_CACHE:-~/.cache/inspect-ranges/images}:/images:ro
      - scratch:/scratch
      - ../net-compile/tmp/render:/render:ro
    healthcheck:
      test: ["CMD", "test", "-e", "/run/range-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  scratch:
