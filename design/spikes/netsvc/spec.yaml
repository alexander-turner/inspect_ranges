# Network-services conformance spec (schema v0.2): DHCP reservations and all
# three DNS shapes realized from the allocation.
range:
  name: netsvc
  schema_version: "0.2"
  description: >
    Two segments: lab addresses its guests via DHCP reservations and serves
    name records (one derived from a guest, one explicit); net2 hands its
    guests the authoritative guest plus an external resolver. No router: the
    segments stay mutually unreachable.

networks:
  - name: lab
    cidr: 10.95.10.0/24
    mode: isolated
    dhcp: true
    dns:
      records:
        - { name: web }                              # derived: web's allocated address
        - { name: files.corp.example, ip: 10.95.10.200 }
  - name: net2
    cidr: 10.95.20.0/24
    mode: isolated
    dns:
      authoritative: [db]
      nameservers: [9.9.9.9]

hosts:
  - name: web
    os: { type: linux }
    image: noble-range-guest
    interfaces: [{ network: lab }]        # allocated: 10.95.10.10 (service address .1, attacker .2)
  - name: db
    os: { type: linux }
    image: noble-range-guest
    interfaces: [{ network: net2, ip: 10.95.20.5 }]
  - name: app
    os: { type: linux }
    image: noble-range-guest
    interfaces: [{ network: net2 }]       # allocated: 10.95.20.10

attacker:
  interfaces: [{ network: lab }]
  entry: external
